metadata:
  title: EVT1 cradle USB board J93 to spring-pin board J94
  notes: EVT first article. Native numeric pin map; verify mating marks/continuity.
    Free-span dimensions are between modeled wire-exit datums; stock blanks are longer
    and are not finished cut lengths. No physical crimp/current/fit acceptance. Keep
    D-/D+ paired. Route rear J94 joints through the open retainer window/downward
    channel. Pin-board thickness remains1mm; verify USB/power/strain relief in the
    real cradle.
options:
  fontname: Arial
  color_mode: FULL
connectors:
  J93:
    type: USB board hand-solder lands, F.Cu
    pins:
    - 1
    - 2
    - 3
    - 4
    pinlabels: &id001
    - GND
    - DOCK_DM
    - DOCK_DP
    - DOCK_5V
    ignore_in_bom: true
  J94:
    type: Pin board rear hand-solder lands, B.Cu
    pins:
    - 1
    - 2
    - 3
    - 4
    pinlabels: *id001
    ignore_in_bom: true
cables:
