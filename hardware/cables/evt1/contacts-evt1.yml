metadata:
  title: EVT1 four fixed feedthrough targets to flange J1
  notes: EVT first article. Native numeric pin map; verify mating marks/continuity.
    Free-span dimensions are between modeled wire-exit datums; stock blanks are longer
    and are not finished cut lengths. No physical crimp/current/fit acceptance. D-/D+
    are an adjacent short pair. Route together with controlled lay and minimal end
    fanout; no90ohm or USB signal-integrity qualification follows from this logical
    drawing. Solder/clean/cool posts before fitting their inner rings.
options:
  fontname: Arial
  color_mode: FULL
connectors:
  TARGET:
    type: Fixed contact tails; X-38/-32/-26/-20
    pins:
    - 1
    - 2
    - 3
    - 4
    pinlabels: &id001
    - GND
    - USB_DM_CONTACT
    - USB_DP_CONTACT
    - DOCK_5V
    ignore_in_bom: true
  J1:
    type: Flange B.Cu hand-solder lands
    pins:
    - 1
    - 2
    - 3
    - 4
    pinlabels: *id001
    ignore_in_bom: true
