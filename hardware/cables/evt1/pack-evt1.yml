metadata:
  title: EVT1 protected pack / disconnect and two independent NTC pairs
  notes: EVT first article. Native numeric pin map; verify mating marks/continuity.
    Free-span dimensions are between modeled wire-exit datums; stock blanks are longer
    and are not finished cut lengths. No physical crimp/current/fit acceptance. Pack
    socket, two SACH contacts and short factory power leads belong to BC-PACK-EVT1-001;
    do not buy/count them again as loose cable parts. Four NTC extension joints remain
    separately insulated.
options:
  fontname: Arial
  color_mode: FULL
connectors:
  J2:
    type: Body four-net five-land solder interface
    pins:
    - 1
    - 2P
    - 2S
    - 3
    - 4
    pinlabels:
    - PACK_P
    - GND power
    - GND sensors
    - PACK_NTC
    - PACK_GUARD
    ignore_in_bom: true
    notes: '2P/2S are separate physical lands on native logical pin2.

      Both32AWG sensor returns join at2S; power return lands only at2P.

      No pack-side shared return.'
  BODY_PWR:
    type: JST ACH body plug
    pins:
    - 1
    - 2
    pinlabels:
    - PACK_P
    - GND
    ignore_in_bom: false
    manufacturer: JST
    mpn: ACHTP-02V-S
  PACK_PWR:
    type: 'Factory pack socket; included in custom

      protected-pack request'
    pins:
    - 1
    - 2
    pinlabels:
    - PACK_P
    - GND
    ignore_in_bom: true
    manufacturer: JST
    mpn: ACHTR-02V-S
  PACK:
    type: Factory-protected1S pack; no bare cell tabs
    pins:
    - 1
    - 2
    pinlabels:
    - Protected P+
    - Protected P-
    ignore_in_bom: true
  TH1:
    type: Factory-leaded external NTC
    pins:
    - 1
    - 2
    pinlabels:
    - 10k NTC signal
    - Independent return
    ignore_in_bom: false
    manufacturer: Vishay
    mpn: NTCLE413E2103F524A
    notes: 'Factory52+/-5mm leads are included. Trim/extend with insulated

      solder laps; do not ordinary-crimp the overall-tinned E2 leads.

      Keep head dry; no direct casting/potting.'
  TH2:
    type: Factory-leaded external NTC
    pins:
    - 1
    - 2
    pinlabels:
    - 10k NTC signal
    - Independent return
    ignore_in_bom: false
    manufacturer: Vishay
    mpn: NTCLE413E2103F524A
    notes: 'Factory52+/-5mm leads are included. Trim/extend with insulated

      solder laps; do not ordinary-crimp the overall-tinned E2 leads.

      Keep head dry; no direct casting/potting.'
