[platformio]
src_dir = main

[env:prototype-r0]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions.csv
build_flags = -Wall -Wextra -Werror=return-type

[env:evt1]
extends = env:prototype-r0
build_flags = ${env:prototype-r0.build_flags} -DBOARD_EVT1=1

[env:evt1-one-board]
extends = env:evt1
build_flags = ${env:evt1.build_flags} -DBOARD_EVT1_ONE_BOARD=1
