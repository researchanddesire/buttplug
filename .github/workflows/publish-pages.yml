name: Publish Compass docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - developer-docs/**
      - assembly-docs/assembly-guide.md
      - assembly-docs/assets/**
      - .github/workflows/publish-pages.yml
  pull_request:
    branches: [main]
    paths:
      - developer-docs/**
      - assembly-docs/assembly-guide.md
      - assembly-docs/assets/**
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: developer-docs/requirements.txt
      - name: Build and validate the docs
        run: |
          python -m pip install -r developer-docs/requirements.txt
          python -m mkdocs build --strict -f developer-docs/mkdocs.yml
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > developer-docs/site/build-info.json
      - name: Upload the rendered site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: developer-docs/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
